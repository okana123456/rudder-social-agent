<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="options card">
      <div class="brand"><span class="mark">R</span>Rudder extension settings</div>
      <p class="notice">
        Confirmation mode is the safe default. Autopilot may violate group or platform rules; enable
        it only for destinations where you have permission and accept the risk.
      </p>
      <form id="form">
        <div class="field">
          <label>Dashboard URL</label><input name="dashboardUrl" type="url" required />
        </div>
        <div class="field">
          <label>Supabase URL</label><input name="supabaseUrl" type="url" required />
        </div>
        <div class="field">
          <label>Supabase public anon key</label><input name="supabaseAnonKey" required />
        </div>
        <div class="field"><label>Device ID</label><input name="deviceId" required /></div>
        <div class="field">
          <label>One-time device token</label><input name="deviceToken" type="password" required />
        </div>
        <div class="field">
          <label>Operating mode</label
          ><select name="mode">
            <option value="confirmation">Confirmation</option>
            <option value="autopilot">Autopilot</option>
          </select>
        </div>
        <label
          ><input name="ack" type="checkbox" /> I understand autopilot can break when Facebook
          changes and can carry account/policy risk.</label
        ><label><input name="notifications" type="checkbox" /> Browser notifications</label
        ><label
          ><input name="diagnostics" type="checkbox" /> Allow diagnostic screenshots after
          errors</label
        >
        <div class="field">
          <label>Maximum jobs per session</label
          ><input name="maxJobs" type="number" min="1" max="20" value="5" />
        </div>
        <button>Save and test connection</button>
        <p id="message"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
