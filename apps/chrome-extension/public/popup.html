<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup">
      <div class="brand"><span class="mark">R</span>Rudder Group Assistant</div>
      <div id="status" class="card">Loading status…</div>
      <div class="actions">
        <button id="next">Process next post</button
        ><button id="pause" class="secondary">Pause</button
        ><button id="dashboard" class="secondary">Open dashboard</button
        ><button id="options" class="secondary">Settings</button
        ><button id="stop" class="danger" style="grid-column: 1/-1">Emergency stop</button>
      </div>
      <p id="error" class="error"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
